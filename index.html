<style>

<script>
const sections = [
{ id:"pron", title:"I. Pronunciation", type:"mc", items:[
{q:"Choose the word whose underlined part is different: nurse / surf / picture / return.",opts:["A. n<u>u</u>rse","B. s<u>u</u>rf","C. pict<u>u</u>re","D. ret<u>u</u>rn"],a:2,why:"“Picture” has the sound /tʃ/ in the underlined part, while the other words contain the vowel sound /ɜː/ (as indicated by the exercise).",vi:"Chọn từ có phần gạch chân phát âm khác. “Picture” có âm /tʃ/ ở phần được xét, khác với các từ còn lại."},
{q:"Choose the word whose underlined part is different: belief / life / soft / of.",opts:["A. belie<u>f</u>","B. li<u>f</u>e","C. so<u>f</u>t","D. o<u>f</u>"],a:3,why:"The underlined “f” in “of” is pronounced /v/, while the “f” in the other words is pronounced /f/.",vi:"Chọn từ có phần gạch chân phát âm khác. Chữ “f” trong “of” được phát âm là /v/, còn trong các từ còn lại là /f/."},
{q:"Choose the word whose -ed ending is different: jumped / washed / liked / needed.",opts:["A. jump<u>ed</u>","B. wash<u>ed</u>","C. lik<u>ed</u>","D. need<u>ed</u>"],a:3,why:"The -ed ending in “needed” is pronounced /ɪd/. In “jumped”, “washed” and “liked”, -ed is pronounced /t/.",vi:"Chọn từ có đuôi -ed phát âm khác. “Needed” có đuôi -ed phát âm /ɪd/; ba từ còn lại có đuôi -ed phát âm /t/."},
{q:"Choose the word whose underlined part is different: prefer / better / teacher / worker.",opts:["A. pref<u>e</u>r","B. bett<u>e</u>r","C. teach<u>e</u>r","D. work<u>e</u>r"],a:0,why:"The highlighted answer in the provided answer key is A. “Prefer”.",vi:"Theo đáp án được tô vàng trong tài liệu, đáp án là A. “Prefer”."},
{q:"Choose the word whose -ed ending is different: annoyed / excited / bored / terrified.",opts:["A. annoy<u>ed</u>","B. excit<u>ed</u>","C. bor<u>ed</u>","D. terrifi<u>ed</u>"],a:1,why:"The highlighted answer in the provided answer key is B. “Excited”.",vi:"Theo đáp án được tô vàng trong tài liệu, đáp án là B. “Excited”."}
]},
{ id:"lang1", title:"II. Language – Multiple choice",type:"mc",items:[
{q:"My brother likes ………. camping at the weekend.",opts:["A. go","B. goes","C. going","D. went"],a:2,why:"After “like”, we can use a verb ending in -ing to talk about an activity we enjoy: like + V-ing.",vi:"Anh/em trai tôi thích đi cắm trại vào cuối tuần."},
{q:"My brothers do ………. when they have free time.",opts:["A. jogging","B. karate","C. coin","D. camping"],a:1,why:"We say “do karate”. We use “do” with karate, judo and similar martial arts.",vi:"Các anh/em trai tôi tập karate khi có thời gian rảnh."},
{q:"A lot of people enjoy ……………. things such as dolls, stamps or bottles.",opts:["A. collecting","B. arranging","C. doing","D. making"],a:0,why:"“Enjoy” is followed by V-ing. “Collecting things” means gathering and keeping items as a hobby.",vi:"Nhiều người thích sưu tầm những thứ như búp bê, tem hoặc chai lọ."},
{q:"………. are a common condition that often occurs when our lips dry.",opts:["A. Chapped lips","B. Red spots","C. Sunburn","D. Headache"],a:0,why:"“Chapped lips” means dry, cracked lips. The clue is “when our lips dry”.",vi:"Môi nứt nẻ là tình trạng phổ biến thường xảy ra khi môi chúng ta bị khô."},
{q:"My sister has an ………. to sunflowers so I don’t arrange them in the house.",opts:["A. earache","B. backache","C. itchy","D. allergy"],a:3,why:"“Have an allergy to” means to be allergic to something. The article “an” also fits “allergy”.",vi:"Chị/em gái tôi bị dị ứng với hoa hướng dương nên tôi không cắm chúng trong nhà."},
{q:"It is ………. to eat a lot of sweetened food and drinks.",opts:["A. health","B. healthy","C. unhealthy","D. healthily"],a:2,why:"“Unhealthy” is an adjective meaning bad for your health. It describes the action of eating too much sweetened food and drink.",vi:"Ăn nhiều thức ăn và đồ uống có đường là không tốt cho sức khỏe."},
{q:"Our school has a program to ………. for children from poor families in HCM city.",opts:["A. ask","B. offer","C. tutor","D. volunteer"],a:3,why:"The answer key highlights “volunteer”. The phrase means taking part in voluntary work for children.",vi:"Trường chúng tôi có một chương trình tình nguyện dành cho trẻ em thuộc các gia đình nghèo ở Thành phố Hồ Chí Minh."},
{q:"Community service is the work we do for the ………. of the community.",opts:["A. benefits","B. forces","C. problems","D. events"],a:0,why:"The fixed phrase is “for the benefit(s) of the community”, meaning for the good of the community.",vi:"Hoạt động phục vụ cộng đồng là công việc chúng ta làm vì lợi ích của cộng đồng."},
{q:"We ………. lots of vegetables in the school garden.",opts:["A. plant","B. tutor","C. donate","D. help"],a:0,why:"“Plant vegetables” means put seeds or young plants in the ground so they can grow.",vi:"Chúng tôi trồng nhiều rau trong vườn trường."},
{q:"We ………. litter around our school.",opts:["A. help","B. pick up","C. water","D. donate"],a:1,why:"“Pick up litter” means collect rubbish from the ground.",vi:"Chúng tôi nhặt rác xung quanh trường."}
]},
{ id:"verbs",title:"II. Language – Verb tenses",type:"text",items:[
{q:"Lan’s sister (not/ visit) __________ Ho Chi Minh City last month.",a:"did not visit",hint:"Past simple negative: S + did not (didn’t) + V nguyên mẫu.",why:"“Last month” indicates the past simple. In the negative, use did not + base verb: did not visit.",vi:"Chị/em gái của Lan đã không đến thăm Thành phố Hồ Chí Minh vào tháng trước."},
{q:"Last summer, my father (teach) __________ me to drive.",a:"taught",hint:"Past simple of the irregular verb “teach”.",why:"“Last summer” indicates the past simple. “Teach” is irregular: teach → taught.",vi:"Mùa hè năm ngoái, bố tôi đã dạy tôi lái xe."},
{q:"My brother loves (make) __________ models of small cars and planes.",a:"making",hint:"After “love”, use V-ing or to-infinitive. Follow the answer given in the key.",why:"The supplied answer is “making”. “Love + V-ing” expresses enjoying an activity.",vi:"Anh/em trai tôi thích làm mô hình những chiếc ô tô nhỏ và máy bay."},
{q:"My aunt often (donate) __________ money to help street children.",a:"donates",hint:"Present simple: with he/she/it or a singular subject, add -s/-es to the verb.",why:"“Often” shows a habit. “My aunt” is third-person singular, so donate → donates.",vi:"Dì/cô tôi thường quyên góp tiền để giúp đỡ trẻ em đường phố."},
{q:"They (not/ have) __________ breakfast every morning.",a:"do not have",hint:"Present simple negative with “they”: do not + base verb.",why:"“Every morning” shows a routine. With “they”, use do not + have.",vi:"Họ không ăn sáng mỗi buổi sáng."},
{q:"__________ Lan (go) __________ jogging last Sunday morning?",a:"did|go",hint:"Past simple question: Did + subject + base verb ...?",why:"“Last Sunday morning” indicates the past simple. Use “Did” before the subject and the base verb “go” after it.",vi:"Lan có đi chạy bộ vào sáng Chủ nhật tuần trước không?"},
{q:"__________ you (go) __________ to see the concert yesterday?",a:"did|go",hint:"Past simple question: Did + subject + base verb ...?",why:"“Yesterday” indicates the past simple. Use “Did you go”, not “Did you went”.",vi:"Hôm qua bạn có đi xem buổi hòa nhạc không?"},
{q:"They (watch) __________ TV late at night yesterday.",a:"watched",hint:"Past simple: regular verb + -ed. Look at “yesterday”.",why:"“Yesterday” indicates the past simple. Add -ed to the regular verb watch: watched.",vi:"Hôm qua họ đã xem TV muộn vào ban đêm."}
]},
{ id:"gap",title:"III. Reading – Breakfast (Gap filling)",type:"readingmc",passage:"Breakfast is the (1) ______ important meal of the day. It provides the nutrients your body needs for good health, the calories it needs for (2) ______ and helps to maintain your blood sugar level. Studies have shown that people who don’t have breakfast have a low blood sugar level and are often slow, tired, hungry and (3) ______ to concentrate. Surprisingly, breakfast actually plays a part in weight control. It's easier to (4) ______ weight if you eat in the morning rather than later in the day. Dividing the day’s calories into three meals helps take-off weight more efficiently than (5) ______ breakfast and having two larger meals a day does.",translation:"Bữa sáng là bữa ăn quan trọng nhất trong ngày. Bữa sáng cung cấp các chất dinh dưỡng mà cơ thể bạn cần để có sức khỏe tốt, lượng calo cần thiết cho năng lượng và giúp duy trì lượng đường trong máu. Các nghiên cứu cho thấy những người không ăn sáng có lượng đường trong máu thấp và thường chậm chạp, mệt mỏi, đói bụng và không thể tập trung. Đáng ngạc nhiên là bữa sáng thực sự đóng vai trò trong việc kiểm soát cân nặng. Bạn sẽ dễ giảm cân hơn nếu ăn vào buổi sáng thay vì ăn muộn hơn trong ngày. Chia lượng calo trong ngày thành ba bữa giúp giảm cân hiệu quả hơn so với việc bỏ bữa sáng và ăn hai bữa lớn hơn mỗi ngày.",items:[
{q:"Choose the best word for gap (1): Breakfast is the (1) ______ important meal of the day.",opts:["A. healthy","B. tasty","C. main","D. most"],a:3,why:"The superlative structure is “the most + adjective”: the most important meal.",vi:"Bữa sáng là bữa ăn quan trọng nhất trong ngày."},
{q:"Choose the best word for gap (2): the calories it needs for (2) ______.",opts:["A. strength","B. power","C. energy","D. effort"],a:2,why:"“Energy” is the natural word for the fuel the body needs to function.",vi:"Bữa sáng cung cấp lượng calo mà cơ thể cần để có năng lượng."},
{q:"Choose the best word for gap (3): hungry and (3) ______ to concentrate.",opts:["A. able","B. enable","C. unable","D. capable"],a:2,why:"The sentence describes a negative effect of skipping breakfast. “Unable to concentrate” means cannot concentrate.",vi:"Những người không ăn sáng thường chậm chạp, mệt mỏi, đói bụng và không thể tập trung."},
{q:"Choose the best word for gap (4): It's easier to (4) ______ weight.",opts:["A. lose","B. put","C. gain","D. drop"],a:0,why:"The common collocation is “lose weight” (giảm cân).",vi:"Bạn sẽ dễ giảm cân hơn nếu ăn vào buổi sáng thay vì ăn muộn hơn trong ngày."},
{q:"Choose the best word for gap (5): than (5) ______ breakfast.",opts:["A. skipping","B. making","C. buying","D. serving"],a:0,why:"“Skip breakfast” means not eat breakfast. After “than” here, the -ing form is used to compare activities.",vi:"Chia lượng calo thành ba bữa giúp giảm cân hiệu quả hơn so với việc bỏ bữa sáng và ăn hai bữa lớn hơn mỗi ngày."}
]},
{ id:"tf",title:"III. Reading – Hobbies (True / False)",type:"readingtf",passage:"Almost everybody has some kinds of hobby. Hoa’s hobbies are listening to music and watching television. She is very fond of music. When she is free, she often listens to her favorite songs from an old cassette recorder. At weekends, she usually goes to music shops in the downtown areas to buy good CDs. Of the famous pop singers, she prefers Frank Sinatra, Elvis Presley, Madonna and Paul McCartney. She also spends an hour after dinner watching news and documentary programmes. She particularly enjoys the programme “The World Here and There” because it broadens her knowledge of nature and human civilizations. She thinks that her hobbies are very useful. They widen her knowledge, relax her mind, and make her feel better about herself.",translation:"Hầu như mọi người đều có một vài sở thích. Sở thích của Hoa là nghe nhạc và xem truyền hình. Cô ấy rất yêu âm nhạc. Khi rảnh rỗi, cô thường nghe những bài hát yêu thích từ một chiếc máy cassette cũ. Vào cuối tuần, cô thường đến các cửa hàng âm nhạc ở khu vực trung tâm thành phố để mua những đĩa CD hay. Trong số các ca sĩ nhạc pop nổi tiếng, cô thích Frank Sinatra, Elvis Presley, Madonna và Paul McCartney hơn. Cô cũng dành một giờ sau bữa tối để xem tin tức và các chương trình tài liệu. Cô đặc biệt yêu thích chương trình “The World Here and There” vì chương trình mở rộng hiểu biết của cô về thiên nhiên và các nền văn minh nhân loại. Cô nghĩ rằng sở thích của mình rất hữu ích. Chúng mở rộng kiến thức, giúp cô thư giãn đầu óc và khiến cô cảm thấy hài lòng hơn về bản thân.",items:[
{q:"Almost everybody has some kinds of hobby.",a:"T",why:"The first sentence states that almost everybody has some kind of hobby.",vi:"Hầu như mọi người đều có một vài sở thích."},
{q:"Lan’s hobbies are listening to music and reading books.",a:"F",why:"The passage says Hoa’s hobbies are listening to music and watching television, not reading books.",vi:"Sở thích của Lan là nghe nhạc và đọc sách. → Sai: Bài đọc nói sở thích của Hoa là nghe nhạc và xem truyền hình."},
{q:"Lan often listens to favorite songs from a modern smartphone when free.",a:"F",why:"The passage says she listens using an old cassette recorder, not a modern smartphone.",vi:"Khi rảnh, Lan thường nghe những bài hát yêu thích bằng điện thoại thông minh hiện đại. → Sai: Cô ấy nghe bằng một chiếc máy cassette cũ."},
{q:"At weekends, Lan usually goes to music shops in downtown areas to buy good CDs.",a:"T",why:"This information matches the sentence about going to music shops at weekends to buy CDs. The passage names Hoa, although the statement says Lan.",vi:"Vào cuối tuần, Lan thường đến các cửa hàng âm nhạc ở khu vực trung tâm để mua những đĩa CD hay. → Nội dung hoạt động khớp với bài đọc; tài liệu dùng tên Hoa trong đoạn văn nhưng dùng Lan ở câu nhận định."},
{q:"Lan spends two hours after dinner watching news and documentary programmes.",a:"F",why:"The passage says she spends one hour after dinner, not two hours.",vi:"Lan dành hai giờ sau bữa tối để xem tin tức và chương trình tài liệu. → Sai: Bài đọc nói cô ấy dành một giờ."},
{q:"The programme “The World Here and There” helps broaden Lan’s knowledge of nature and human civilizations.",a:"T",why:"The passage directly says the programme broadens her knowledge of nature and human civilizations. The name in the passage is Hoa.",vi:"Chương trình “The World Here and There” giúp mở rộng hiểu biết của Lan về thiên nhiên và các nền văn minh nhân loại. → Nội dung đúng theo bài đọc; đoạn văn dùng tên Hoa."}
]},
{ id:"readq",title:"III. Reading – Volunteer group",type:"readingtext",passage:"A volunteer group came to our little village last month. When they arrived, the village children ran after them and we heard their loud songs. On the first day, they had a talk with the head of the village in the morning, and later on with the villagers in the evening. They brought lots of things with them such as clothes, food, and school things. During the day, they did a lot of different and helpful things for us. They repaired the furniture such as chairs and tables in our village school and also fixed the houses for elderly people. In the evening, they taught the village children songs and games. Life in our village became newer and more exciting. Everyone had a good time.",translation:"Một nhóm tình nguyện viên đã đến ngôi làng nhỏ của chúng tôi vào tháng trước. Khi họ đến, trẻ em trong làng chạy theo họ và chúng tôi nghe thấy những bài hát vang lên. Vào ngày đầu tiên, buổi sáng họ nói chuyện với trưởng làng, sau đó vào buổi tối họ nói chuyện với dân làng. Họ mang theo nhiều thứ như quần áo, thức ăn và đồ dùng học tập. Trong ngày, họ làm nhiều việc khác nhau và hữu ích cho chúng tôi. Họ sửa chữa đồ nội thất như ghế và bàn ở trường làng, đồng thời sửa nhà cho những người cao tuổi. Vào buổi tối, họ dạy trẻ em trong làng các bài hát và trò chơi. Cuộc sống trong làng trở nên mới mẻ và thú vị hơn. Mọi người đều có khoảng thời gian vui vẻ.",type2:"short",items:[
{q:"When did the volunteer group come to the little village?",a:"The volunteer group came to the little village last month.",hint:"Look at the first sentence. Answer with “last month”.",why:"The first sentence gives the time directly: last month.",vi:"Nhóm tình nguyện viên đã đến ngôi làng nhỏ vào tháng trước."},

let current=0, positions={}, state={};
sections.forEach(s=>{positions[s.id]=0;state[s.id]=s.items.map(()=>({done:false,correct:false,value:null,showHint:false}))});
function login(){if(document.getElementById('password').value==='367'){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';renderTabs();render()}else document.getElementById('loginMsg').textContent='Incorrect password. Please try again.'}
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
function renderTabs(){document.getElementById('tabs').innerHTML=sections.map((s,i)=>`<button class="${i===current?'active':''}" onclick="switchSection(${i})">${s.title}</button>`).join('')}
function switchSection(i){current=i;renderTabs();render()}
function section(){return sections[current]} function pos(){return positions[section().id]} function st(){return state[section().id][pos()]}
function escapeHTML(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
 const s=section(),i=pos(),item=s.items[i],v=state[s.id][i],done=state[s.id].filter(x=>x.done).length,score=state[s.id].filter(x=>x.done&&x.correct).length;
 const progress=Math.round(done/s.items.length*100);
 let body='';
 if(s.type==='mc'||s.type==='readingmc'||s.type==='readingtf'){
  let opts=s.type==='readingtf'?['True','False']:item.opts;
  body=`<div class="qtext">${escapeHTML(item.q)}</div><div class="options">${opts.map((o,j)=>`<button class="option ${v.done?(j===(s.type==='readingtf'?(item.a==='T'?0:1):item.a)?'right':(v.value===j?'incorrect':'')):''} ${v.value===j?'chosen':''}" ${v.done?'disabled':''} onclick="choose(${j})">${s.id==="pron"?o:escapeHTML(o)}</button>`).join('')}</div>`;
  if(v.done)body+=feedback(item,v,s.type==='readingtf'?(item.a==='T'?0:1):item.a);
 }else if(s.type==='text'||s.type==='readingtext'){
  body=`<div class="qtext">${escapeHTML(item.q)}</div><div class="answer-area"><label><b>Your answer</b></label><input class="answer" id="typed" ${v.done?'disabled':''} value="${escapeHTML(v.value||'')}" placeholder="Type your answer here"></div><button class="hint" onclick="showHint()">HINT</button> <button onclick="checkText()" ${v.done?'disabled':''}>Check</button><div id="hintbox" class="hintbox" style="display:${v.showHint?'block':'none'}">${escapeHTML(item.hint)}</div>${v.done?feedback(item,v):''}`;
 }else if(s.type==='writing'){
  body=`<div class="qtext">${escapeHTML(item.q)}</div><div class="answer-area"><label><b>Complete only the yellow part</b></label><div class="writing-line"><span>${escapeHTML(item.prefix)}</span><textarea class="answer yellow-entry" id="typed" rows="2" ${v.done?'disabled':''} placeholder="Type the highlighted part">${escapeHTML(v.value||'')}</textarea><span>${escapeHTML(item.suffix)}</span></div></div><button class="hint" onclick="showHint()">HINT</button> <button onclick="checkText()" ${v.done?'disabled':''}>Check</button><div id="hintbox" class="hintbox" style="display:${v.showHint?'block':'none'}">${escapeHTML(item.hint)}</div>${v.done?feedback(item,v):''}`;
 }
 let reading=(s.type==='readingmc'||s.type==='readingtf'||s.type==='readingtext')?`<div class="layout"><div class="reading-pane"><h3>Reading passage</h3><p>${escapeHTML(s.passage)}</p><h3>Vietnamese translation</h3><p>${escapeHTML(s.translation)}</p></div><div class="question-pane"><h3>Questions</h3><div class="question-number">QUESTION ${i+1} OF ${s.items.length}</div>${body}${nav(s,i)}</div></div>`:`<div><div class="question-number">QUESTION ${i+1} OF ${s.items.length}</div>${body}${nav(s,i)}</div>`;
 document.getElementById('workspace').innerHTML=`<div class="section-head"><div><h2>${s.title}</h2><div class="scoreline">Score: ${score} / ${done} answered · ${s.items.length} questions</div></div><button class="reset" onclick="resetSection()">Reset this section</button></div><div class="progress"><span style="width:${progress}%"></span></div>${reading}`;
}
function nav(s,i){return `<div class="navrow"><button class="secondary" onclick="move(-1)" ${i===0?'disabled':''}>Previous</button><label class="small">Go to question:</label><select onchange="gotoQuestion(this.value)">${s.items.map((x,j)=>`<option value="${j}" ${j===i?'selected':''}>Question ${j+1}${state[s.id][j].done?' ✓':''}</option>`).join('')}</select><button class="secondary" onclick="move(1)" ${i===s.items.length-1?'disabled':''}>Next</button><button class="reset" onclick="resetQuestion()">Reset this question</button></div>`}
function feedback(item,v,correctIndex){let good=v.correct;let answer=correctIndex!==undefined?(section().type==='readingtf'?(item.a==='T'?'True':'False'):item.opts[correctIndex]):item.a;return `<div class="feedback"><div class="${good?'correct':'wrong'}">${good?'Correct!':'Not quite. The correct answer is: '+escapeHTML(answer)}</div><p><b>Explanation (Vietnamese):</b> ${escapeHTML(item.why)}</p><div class="translation"><b>Nghĩa tiếng Việt cả câu:</b> ${escapeHTML(item.vi)}</div><div class="lock-note">This answer is locked. You cannot answer again unless you reset this question or section.</div></div>`}
function choose(j){let s=section(),v=st(),item=s.items[pos()];if(v.done)return;let key=s.type==='readingtf'?(item.a==='T'?0:1):item.a;v.done=true;v.value=j;v.correct=j===key;render()}
function normalize(x){return String(x||'').trim().toLowerCase().replace(/[’‘]/g,"'").replace(/[.!?]+$/,'').replace(/\s+/g,' ')}
function checkText(){let s=section(),v=st(),item=s.items[pos()];if(v.done)return;let el=document.getElementById('typed');let val=el.value.trim();if(!val){alert('Please type your answer first.');return}v.value=val;v.done=true;
 if(s.type==='writing'){v.correct=normalize(val)===normalize(item.yellow)}
 else {let accepted=item.a.split('|');let parts=val.split(/\s+/);v.correct=accepted.length===2?normalize(val).replace(/\s+/g,'|')===accepted.join('|'):normalize(val)===normalize(item.a)}
 render()}
function showHint(){let v=st();v.showHint=true;render()}
function move(d){positions[section().id]=Math.max(0,Math.min(section().items.length-1,pos()+d));render()}
function gotoQuestion(n){positions[section().id]=Number(n);render()}
function resetQuestion(){if(confirm('Reset this question? Its answer and score will be cleared, and you can try it again.')){state[section().id][pos()]={done:false,correct:false,value:null,showHint:false};render()}}
function resetSection(){if(confirm('Reset all questions and the score in this section?')){state[section().id]=section().items.map(()=>({done:false,correct:false,value:null,showHint:false}));positions[section().id]=0;render()}}
function resetAll(){if(confirm('Reset every section and all scores?')){sections.forEach(s=>{state[s.id]=s.items.map(()=>({done:false,correct:false,value:null,showHint:false}));positions[s.id]=0});current=0;renderTabs();render()}}
document.addEventListener('copy',e=>e.preventDefault());document.addEventListener('cut',e=>e.preventDefault());document.addEventListener('paste',e=>{if(!e.target.matches('input,textarea'))e.preventDefault()});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['c','x','a','s','p'].includes(e.key.toLowerCase()))e.preventDefault()});
</script>
